<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2b201c">
<title>For Stacy, Mi Amor ♡</title>
<style>
:root {
  --lavender: #d6cbff;
  --gold: #dfb356;
  --gold-shadow: rgba(140, 100, 30, 0.4);
  --white: #fff8fc;
  --muted: #e6dfec;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  /* Layers a rich brown and purple gradient over your cheetah print background image to keep lavender text readable */
  background: linear-gradient(135deg, rgba(43, 32, 28, 0.88), rgba(58, 38, 54, 0.85)), 
              url('images/background.jpg') repeat center center fixed;
  background-size: cover;
  color: var(--white);
  font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  text-align: center;
  overflow-x: hidden;
  position: relative;
}

.sunflower-deco {
  position: absolute;
  width: 95px;
  height: auto;
  opacity: 0.95;
  pointer-events: none;
  z-index: 0;
  filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 8px rgba(223, 179, 86, 0.4));
}

.stars, .stars::before, .stars::after {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; background-image: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 40px 70px, var(--lavender), rgba(0,0,0,0)); background-repeat: repeat; background-size: 200px 200px; opacity: 0.25; z-index: 1;
}

.hero {
  min-height: 100svh; padding: 120px 20px 65px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(43, 32, 28, 0.55);
}
.moon {
  font-size: clamp(65px, 12vw, 105px);
  color: var(--gold);
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
  animation: sunGlow 4s ease-in-out infinite alternate;
}
@keyframes sunGlow { to { filter: drop-shadow(0 6px 12px rgba(140, 100, 30, 0.8)); } }

.eyebrow { color: var(--gold); font: 12px "Times New Roman", serif; text-transform: uppercase; letter-spacing: 5px; line-height: 1.8; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
h1 { font-weight: normal; font-size: clamp(36px, 7.5vw, 74px); line-height: 1.15; margin: 18px 0; font-family: "Baskerville", "Playfair Display", Georgia, serif; letter-spacing: 1px; color: var(--lavender); text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9); }

.subtitle { max-width: 580px; color: var(--muted); line-height: 2; font-size: 18px; font-style: italic; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }

.button {
  border: 1px solid var(--gold);
  background: linear-gradient(135deg, #4d372f, #2b201c);
  color: var(--gold); border-radius: 4px; padding: 14px 26px; margin: 12px 6px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); 
  text-transform: uppercase; font: 12px "Times New Roman", serif; letter-spacing: 2px;
  transition: all .3s ease;
}
.button:hover { background: linear-gradient(135deg, #664a40, #42302a); color: var(--white); box-shadow: 0 6px 15px var(--gold-shadow); transform: translateY(-2px); }
.button.secondary { background: rgba(43, 32, 28, 0.6); border-color: rgba(223, 179, 86, 0.5); color: var(--muted); }
.button.secondary:hover { border-color: var(--gold); color: var(--gold); }

.scroll-note { margin-top: 40px; color: var(--gold); font: 11px "Times New Roman", serif; letter-spacing: 3px; opacity: 0.9; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }

section { padding: 90px 20px; scroll-margin-top: 35px; position: relative; }
.section-inner { max-width: 950px; margin: auto; }

h2 { 
  margin: 14px 0; 
  font-family: "Baskerville", "Playfair Display", Georgia, serif; 
  color: var(--lavender);
  text-shadow: 0 4px 10px rgba(0, 0, 0, 0.9);
}
.description { max-width: 620px; margin: 0 auto 35px; color: var(--muted); line-height: 2; font-size: 17px; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }

.soft-section {
  background: rgba(34, 24, 21, 0.82);
  border-top: 1px solid rgba(223, 179, 86, 0.3); border-bottom: 1px solid rgba(223, 179, 86, 0.3);
  backdrop-filter: blur(6px);
}

.gallery {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
  gap: 24px; margin-top: 35px;
}
.photo-card {
  padding: 12px 12px 22px; background: rgba(66, 48, 42, 0.85); 
  border: 1px solid var(--gold);
  border-radius: 4px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
  transition: transform .3s, border-color .3s;
}
.photo-card:hover { transform: translateY(-6px); border-color: var(--lavender); box-shadow: 0 10px 25px var(--gold-shadow); }

.letter-card {
  max-width: 700px; margin: 30px auto; padding: clamp(28px, 5vw, 50px);
  border: 1px solid var(--gold); border-radius: 6px;
  background: rgba(40, 29, 25, 0.94);
  box-shadow: 0 15px 50px rgba(0,0,0,0.8); 
  text-align: left; line-height: 2.1; color: var(--white); font-size: 18px;
}
.letter-card p { margin: 0 0 20px; }

.love-languages { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 840px; margin: 30px auto; }
.love-word {
  padding: 10px 16px; border-radius: 3px; border: 1px solid rgba(223, 179, 86, 0.4);
  background: rgba(66, 48, 42, 0.85); color: var(--lavender); font-size: 15px;
  transition: all .25s;
}
.love-word:hover { background: rgba(223, 179, 86, 0.3); border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }

.reason-card {
  max-width: 640px; min-height: 160px; padding: 35px 25px; margin: 25px auto;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--gold); border-radius: 6px;
  background: rgba(43, 32, 28, 0.94);
  color: var(--lavender); font-size: clamp(20px, 3vw, 26px); line-height: 1.9;
  font-family: "Baskerville", "Playfair Display", Georgia, serif;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  box-shadow: 0 12px 40px rgba(0,0,0,0.7);
}
.reason-count { color: var(--gold); font: 12px "Times New Roman", serif; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }

.final-note { padding: 100px 20px; background: rgba(59, 44, 39, 0.75); backdrop-filter: blur(4px); }
.final-note .big-heart { font-size: 56px; color: var(--gold); filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }

footer { padding: 35px 15px; border-top: 1px solid rgba(223, 179, 86, 0.3); color: var(--muted); font: 12px "Times New Roman", serif; letter-spacing: 1px; line-height: 2.2; background: rgba(31, 23, 20, 0.95); }

.heart {
  position: fixed; bottom: -40px; pointer-events: none; z-index: 10;
}
</style>
</head>
<body>
  <!-- Rest of your body/sections remain intact -->
  <section class="final-note">
    <div class="big-heart" aria-hidden="true">🌻</div>
    <p class="eyebrow">To My Sun</p>
    <h2 style="font-size:clamp(32px, 5vw, 48px); margin:14px 0; color:var(--lavender); text-shadow:0 4px 10px rgba(0,0,0,0.9);">Beneath This Sky,<br>It Is Forever You.</h2>
    <p class="description"> you are my favorite sight, my favorite smell, my favorite person to hear, my favorite person ot be next to. Thank you for being part of my universe, Stacy. </p>
    <button class="button" onclick="hearts(35)"> Shower of Sunflowers & Gold ♡ </button>
  </section>

  <script>
    function hearts(count) {
      // existing hearts script
    }
    function toggleMusic() {
      // existing audio toggle logic
      let musicButton = document.getElementById('musicButton');
      let music = document.getElementById('bgMusic');
      if (music.paused) {
        music.play();
        musicButton.textContent = "♫ Play Another";
      } else {
        music.pause();
        musicButton.textContent = "♫ Play Another";
      }
    }
  </script>
</body>
</html>
