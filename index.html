<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2b201c">
<title>For Stacy, My Sunlit Heart ♡</title>
<style>
:root {
    --lavender: #d6cbff;
    --gold: #dfb356;
    --gold-shadow: rgba(140, 100, 30, 0.4);
    --white: #fff8fc;
    --muted: #e6dfec;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
    margin: 0;
    /* Combines a rich brown and purple-plum gradient overlay with your cheetah background image */
    background: linear-gradient(135deg, rgba(43, 32, 28, 0.88), rgba(58, 38, 54, 0.85)), 
                url('images/background.jpg') repeat center center fixed;
    background-size: cover;
    color: var(--white);
    font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    text-align: center;
    overflow-x: hidden;
    position: relative;
}
