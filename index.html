<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2b201c">
<title>For Stacy, My Sunlit Heart ♡</title>
<style>
:root {
    --lavender: #d6cbff;
    --gold: #dfb356;
    --gold-shadow: rgba(140, 100, 30, 0.4);
    --white: #fff8fc;
    --muted: #e6dfec;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
    margin: 0;
    /* Rich chocolate brown base color */
    background-color: #2b201c;
    /* Layers a romantic purple/brown gradient overlay on top of CSS-generated cheetah spots */
    background-image: 
        linear-gradient(135deg, rgba(43, 32, 28, 0.90), rgba(58, 38, 54, 0.88)),
        radial-gradient(ellipse at center, #3d261d 20%, transparent 21%),
        radial-gradient(ellipse at center, #1a120f 20%, transparent 21%);
    background-size: 100% 100%, 50px 50px, 50px 50px;
    background-position: 0 0, 0 0, 25px 25px;
    color: var(--white);
    font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    text-align: center;
    overflow-x: hidden;
    position: relative;
}

/* Make sure your lavender text pops clearly */
h1, h2, h3, .lavender-text {
    color: var(--lavender);
}
</style>
</head>
